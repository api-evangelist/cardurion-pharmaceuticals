name: Cardurion Pharmaceuticals
description: 'Cardurion Pharmaceuticals is a clinical-stage biopharmaceutical company focused on transforming
  the treatment of cardiovascular disease and heart failure. Its research and development pipeline centers
  on novel small-molecule programs including PDE9 inhibition for chronic heart failure (HFrEF and HFpEF)
  and CaMKII inhibition for cardiac diseases such as catecholaminergic polymorphic ventricular tachycardia
  (CPVT). Cardurion combines target discovery, adaptive clinical trial design, and precision-medicine
  approaches, and was surfaced as a portfolio company of GV (Google Ventures). The company publishes a
  corporate and R&D website but does not expose a public developer API surface at this time.'
